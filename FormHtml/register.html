<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập / Đăng ký</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
      .form-outline {
          position: relative;
          margin-bottom: 1.5rem;
      }
      
      .form-control:focus {
          border-color: #3b71ca;
          box-shadow: 0 0 0 0.25rem rgba(59, 113, 202, 0.25);
      }
      
      .form-label {
          position: absolute;
          top: 0;
          left: 0.75rem;
          padding: 0.4rem 0.25rem;
          background: white;
          transition: all 0.2s ease-out;
          pointer-events: none;
      }
      
      .form-control:focus ~ .form-label,
      .form-control:not(:placeholder-shown) ~ .form-label {
          transform: translateY(-1.1rem) scale(0.8);
          background: white;
          padding: 0 0.2rem;
          color: #3b71ca;
      }
      
      .btn-block {
          display: block;
          width: 100%;
      }
      
      .btn-floating {
          width: 35px;
          height: 35px;
          border-radius: 50%;
          padding: 0;
          display: inline-flex;
          justify-content: center;
          align-items: center;
          transition: all 0.2s ease-in-out;
      }
      
      .btn-floating:hover {
          transform: translateY(-3px);
          box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      }
      
      .nav-pills .nav-link {
          color: #666;
          font-weight: 500;
          border-radius: 0.5rem;
          padding: 0.75rem 1.5rem;
      }
      
      .nav-pills .nav-link.active {
          background-color: #3b71ca;
          color: white;
      }
      
      .tab-content {
          padding: 2rem;
          background: white;
          border-radius: 0.5rem;
          box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      }
      
      .social-login {
          border-bottom: 1px solid #dee2e6;
          position: relative;
          margin-bottom: 1.5rem;
      }
      
      .social-login span {
          background: white;
          padding: 0 1rem;
          color: #666;
          position: relative;
          top: 0.75rem;
      }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
      <div class="row justify-content-center">
          <div class="col-md-6">
              <!-- Pills navs -->
              <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
                  <li class="nav-item" role="presentation">
                      <a class="nav-link active" id="tab-login" data-bs-toggle="pill" href="#pills-login" role="tab"
                          aria-controls="pills-login" aria-selected="true">Đăng nhập</a>
                  </li>
                  <li class="nav-item" role="presentation">
                      <a class="nav-link" id="tab-register" data-bs-toggle="pill" href="#pills-register" role="tab"
                          aria-controls="pills-register" aria-selected="false">Đăng ký</a>
                  </li>
              </ul>

              <!-- Pills content -->
              <div class="tab-content">
                  <!-- Login form -->
                  <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
                      <form>
                          <div class="text-center mb-4">
                              <p>Đăng nhập với:</p>
                              <div class="d-flex justify-content-center">
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-facebook-f"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-google"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-twitter"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-github"></i>
                                  </button>
                              </div>
                              <div class="social-login text-center my-4">
                                  <span>hoặc</span>
                              </div>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="email" id="loginName" class="form-control" placeholder=" "/>
                              <label class="form-label" for="loginName">Email hoặc tên đăng nhập</label>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="password" id="loginPassword" class="form-control" placeholder=" "/>
                              <label class="form-label" for="loginPassword">Mật khẩu</label>
                          </div>

                          <div class="row mb-4">
                              <div class="col-md-6 d-flex justify-content-start">
                                  <div class="form-check">
                                      <input class="form-check-input" type="checkbox" id="loginCheck" checked />
                                      <label class="form-check-label" for="loginCheck">Ghi nhớ đăng nhập</label>
                                  </div>
                              </div>

                              <div class="col-md-6 text-end">
                                  <a href="#!" class="text-primary">Quên mật khẩu?</a>
                              </div>
                          </div>

                          <button type="submit" class="btn btn-primary btn-block mb-4">Đăng nhập</button>
                      </form>
                  </div>

                  <!-- Register form -->
                  <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="tab-register">
                      <form>
                          <div class="text-center mb-4">
                              <p>Đăng ký với:</p>
                              <div class="d-flex justify-content-center">
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-facebook-f"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-google"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-twitter"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-github"></i>
                                  </button>
                              </div>
                              <div class="social-login text-center my-4">
                                  <span>hoặc</span>
                              </div>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="text" id="registerName" class="form-control" placeholder=" "/>
                              <label class="form-label" for="registerName">Họ và tên</label>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="text" id="registerUsername" class="form-control" placeholder=" "/>
                              <label class="form-label" for="registerUsername">Tên đăng nhập</label>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="email" id="registerEmail" class="form-control" placeholder=" "/>
                              <label class="form-label" for="registerEmail">Email</label>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="password" id="registerPassword" class="form-control" placeholder=" "/>
                              <label class="form-label" for="registerPassword">Mật khẩu</label>
                          </div>

                          <div class="form-outline mb-4">
                              <input type="password" id="registerRepeatPassword" class="form-control" placeholder=" "/>
                              <label class="form-label" for="registerRepeatPassword">Xác nhận mật khẩu</label>
                          </div>

                          <div class="form-check d-flex justify-content-center mb-4">
                              <input class="form-check-input me-2" type="checkbox" id="registerCheck" checked />
                              <label class="form-check-label" for="registerCheck">
                                  Tôi đồng ý với các điều khoản sử dụng
                              </label>
                          </div>

                          <button type="submit" class="btn btn-primary btn-block mb-3">Đăng ký</button>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
