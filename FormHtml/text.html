<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../FormCss/listFilm.css"> <!-- Kiểm tra đường dẫn -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">
  <h1 class="listFilm">Danh Sách Phim</h1>
  <div class="row justify-content-center"> <!-- Căn giữa card trong hàng -->
    <div class="col-md-4"> <!-- Thay đổi kích thước card theo cột -->
      <div class="card">
          <img src="../images/hinhnen.jpg" class="card-img" alt="Hình ảnh phim">
          <div class="card-body">
              <h1 class="card-title">N5</h1>
              <p class="card-sub-title">Xem phim</p>
              <p class="card-info">My card</p>
              <button class="card-btn">Book</button>
          </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
