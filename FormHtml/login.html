<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
      .form-outline {
          position: relative;
          margin-bottom: 1.5rem;
      }
      
      .form-control:focus {
          border-color: #3b71ca;
          box-shadow: 0 0 0 0.25rem rgba(59, 113, 202, 0.25);
      }
      
      .form-label {
          position: absolute;
          top: 0;
          left: 0.75rem;
          padding: 0.4rem 0.25rem;
          background: white;
          transition: all 0.2s ease-out;
          pointer-events: none;
      }
      
      .form-control:focus ~ .form-label,
      .form-control:not(:placeholder-shown) ~ .form-label {
          transform: translateY(-1.1rem) scale(0.8);
          background: white;
          padding: 0 0.2rem;
          color: #3b71ca;
      }
      
      .btn-block {
          display: block;
          width: 100%;
      }
      
      .btn-floating {
          width: 35px;
          height: 35px;
          border-radius: 50%;
          padding: 0;
          display: inline-flex;
          justify-content: center;
          align-items: center;
          transition: all 0.2s ease-in-out;
      }
      
      .btn-floating:hover {
          transform: translateY(-3px);
          box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      }
      
      .form-check-input:checked {
          background-color: #3b71ca;
          border-color: #3b71ca;
      }
  </style>
</head>
<body>
  <div class="container py-5">
      <div class="row justify-content-center">
          <div class="col-md-6">
              <div class="card shadow-sm">
                  <div class="card-body p-5">
                      <form>
                          <!-- Email input -->
                          <div class="form-outline mb-4">
                              <input type="email" id="form2Example1" class="form-control" placeholder=" "/>
                              <label class="form-label" for="form2Example1">Địa chỉ email</label>
                          </div>

                          <!-- Password input -->
                          <div class="form-outline mb-4">
                              <input type="password" id="form2Example2" class="form-control" placeholder=" "/>
                              <label class="form-label" for="form2Example2">Mật khẩu</label>
                          </div>

                          <!-- Remember me & Forgot password -->
                          <div class="row mb-4">
                              <div class="col d-flex justify-content-start">
                                  <div class="form-check">
                                      <input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
                                      <label class="form-check-label" for="form2Example31">Ghi nhớ đăng nhập</label>
                                  </div>
                              </div>

                              <div class="col text-end">
                                  <a href="#!" class="text-primary">Quên mật khẩu?</a>
                              </div>
                          </div>

                          <!-- Submit button -->
                          <button type="button" class="btn btn-primary btn-block mb-4">Đăng nhập</button>

                          <!-- Register buttons -->
                          <div class="text-center">
                              <p>Chưa có tài khoản? <a href="../FormHtml/register.html" class="text-primary">Đăng ký</a></p>
                              <p>Hoặc đăng nhập với:</p>
                              <div class="d-flex justify-content-center">
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-facebook-f"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-google"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-twitter"></i>
                                  </button>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                      <i class="fab fa-github"></i>
                                  </button>
                              </div>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
