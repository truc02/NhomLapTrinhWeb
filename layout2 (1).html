<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: auto 50px 1fr 1fr 200px auto;
            min-height: 100vh;
            width: 100vw;
        }

        .header {
            grid-column: 1 / 4;
            background-image: url('../background.jpg'); /* Đặt đường dẫn ảnh tại đây */
            background-size: cover;
            background-position: center; /* Giúp căn giữa ảnh */
            height: 200px;
            margin-bottom: 3px;
        }

        .blue-bar {
            grid-column: 1 / 4;
            background-color: #002F5E;
            height: 50px;
        }

        .main1 {
            background-color: #8EB2D5; /* Màu xanh dương nhạt */
            text-align: center;
            padding: 10px;
        }

        .main2 {
            background-color: #CCCCCC; /* Màu xám nhạt */
            text-align: center;
            padding: 10px;
        }

        .main3 {
            background-color: #B8B88A; /* Màu xanh lá nhạt */
            text-align: center;
            padding: 10px;
        }
        .blue2-bar {
            grid-column: 1 / 4;
            background-color: #1982eb;
            height: 50px;
        }

        .bottom-left {
            background-color: #78AAA2; /* Màu xanh teal */
            grid-column: 1 / 3;
            text-align: center;
            padding: 10px;
        }

        .bottom-right {
            background-color: #4F7394; /* Màu xanh đậm */
            grid-column: 3 / 4;
            text-align: center;
            padding: 10px;
        }

        .footer {
            grid-column: 1 / 4;
            background-color: #002F5E; /* Màu xanh navy */
            text-align: center;
            padding: 20px;
            color: #E9F278; /* Màu vàng nhạt cho text */
        }

        .footer a {
            color: #E9F278;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="blue-bar"></div>
        <div class="main1">Main_1</div>
        <div class="main2">Main_2</div>
        <div class="main3">Main_3</div>
        <div class="blue2-bar"></div>
        <div class="bottom-left"></div>
        <div class="bottom-right"></div>
        <div class="footer">
            Design by: Nguyễn Văn Tèo <br>
            Email: <a href="mailto:teohuyen@yahoo.com">teohuyen@yahoo.com</a>
        </div>
    </div>
</body>
</html>
